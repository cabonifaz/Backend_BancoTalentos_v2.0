server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /bdt

  tomcat:
    max-http-form-post-size: 50MB

spring:
  application:
    name: BancoTalentosBackend
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  expiration: ${JWT_EXPIRATION_MILLISECONDS} # 48 hours in milliseconds
  secret: ${JWT_SECRET}
urlConfig:
  urlFrontBDT: ${URL_BDT}
springdoc:
  swagger-ui:
    path: /bdt-backend.html
  api-docs:
    path: /bdt-docs
# Configuración de logging
logging:
  level:
    root: info
    org.springframework.web: debug
    com.iotdml.configsrf: debug

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
