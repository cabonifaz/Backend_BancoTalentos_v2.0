server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /bdt
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  tomcat:
    max-http-form-post-size: 50MB

spring:
  application:
    name: BancoTalentosBackend
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Servidor MCP: Streamable HTTP en /bdt/mcp. El endpoint lo fija McpConfig.
  ai:
    mcp:
      server:
        name: bdt
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        instructions: "Consultas de solo lectura del Banco de Talentos: talentos, lista negra, entrevistas e indicadores de seleccion."

jwt:
  expiration: ${JWT_EXPIRATION_MILLISECONDS} # 48 hours in milliseconds
  secret: ${JWT_SECRET}
urlConfig:
  urlFrontBDT: ${URL_BDT}
# Envío de correo (entrevistas): "smtp" (spring.mail.*, por defecto) o "graph"
# (Microsoft 365 vía Microsoft Graph, misma app de Entra ID que AutFMI, con
# Mail.Send de aplicación). Con graph, el remitente es MAIL_USERNAME.
mail:
  provider: ${MAIL_PROVIDER:smtp}
microsoft:
  graph:
    tenant-id: ${MS_TENANT_ID:}
    client-id: ${MS_CLIENT_ID:}
    client-secret: ${MS_CLIENT_SECRET:}
    # Opcional: UPN o Id. de objeto del buzón si su UPN no es MAIL_USERNAME.
    sender: ${MS_SENDER:}
# API key del servidor MCP (header X-API-Key) y usuario de servicio con el que
# consulta. Sin MCP_API_KEY la API key queda deshabilitada (solo JWT por Bearer).
# Los IDs dependen de la BD de cada entorno.
mcp:
  api-key: ${MCP_API_KEY:}
  service-user:
    id-usuario: ${MCP_SERVICE_USER_ID:6017}
    id-empresa: ${MCP_SERVICE_EMPRESA_ID:1}
    id-rol: ${MCP_SERVICE_ROL_ID:6}
    username: ${MCP_SERVICE_USERNAME:mcp_fractal}
springdoc:
  swagger-ui:
    path: /bdt-backend.html
  api-docs:
    path: /bdt-docs
# Configuración de logging
logging:
  level:
    root: info
    org.springframework.web: debug
    com.iotdml.configsrf: debug

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
